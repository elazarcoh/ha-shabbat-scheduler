[project]
name = "shabbat-scheduler"
version = "0.1.0"
description = "Home Assistant integration scheduling appliances across Shabbat and Chag"
requires-python = ">=3.14.2"
dependencies = ["pyyaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# e2e is collected on purpose, even though a plain run has neither the
# container nor the token it needs. It skips cleanly without them, and
# e2e/conftest.py prints a loud banner naming what went unverified. Leaving
# e2e OUT of the default run is how it stayed red, unnoticed, through a whole
# plan: "496 passed" was a statement about the Python suite alone and said
# nothing either way about the card in a real browser. "496 passed, 12
# skipped" is less flattering and more honest.
testpaths = ["tests", "e2e"]
pythonpath = ["."]
# A hang, not a failure, is this suite's characteristic breakage. Any test
# using the `freezer` fixture freezes `time.monotonic()`, which IS the
# asyncio event loop's clock - so an `await asyncio.sleep(n)` reached under
# a frozen clock never returns, and neither does `asyncio.wait_for`, whose
# own timeout is measured on that same frozen clock. The engine's retry
# (RETRY_ATTEMPTS x RETRY_DELAY_SECONDS) is exactly such a sleep, so one
# failing service call in a frozen test hangs the whole run forever rather
# than failing it. SIGALRM is measured on real time and is not foolable
# this way, so this turns that hang back into an ordinary test failure.
#
# If pytest-timeout is ever missing, pytest treats BOTH keys below as
# unknown options and merely WARNS - the suite then goes straight back to
# hanging past 600s, in the same invisible shape that cost a whole session
# to diagnose. Two guards, because the obvious one does not work:
#   1. pytest-timeout is declared explicitly in [dependency-groups].dev,
#      not relied on transitively via pytest-homeassistant-custom-component.
#   2. tests/test_packaging.py asserts the option is actually REGISTERED,
#      so a missing plugin fails a test instead of warning.
# `--strict-config` would be the natural third guard and it does work - but
# ONLY from the command line. Putting it in `addopts` is a no-op, because
# addopts is read FROM this file, after this file has already been
# validated. Verified directly; do not "fix" this by adding it to addopts.
timeout = 60
timeout_method = "signal"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-homeassistant-custom-component>=0.13.316",
    # Declared EXPLICITLY, not relied on transitively. It resolves today
    # only via pytest-homeassistant-custom-component; if that edge ever
    # drops, the `timeout` settings above become an unknown option and the
    # suite goes back to hanging past 600s rather than failing. See the
    # comment in [tool.pytest.ini_options]. --strict-config is the second
    # half of the same guard.
    "pytest-timeout>=2.4.0",
    "websockets>=17.0.1",
]
