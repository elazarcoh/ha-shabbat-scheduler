name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run the Python suite (excluding e2e)
        run: uv run pytest tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test
      # tests/test_frontend.py::test_the_committed_bundle_matches_the_committed_sources
      # already catches a source edited without a rebuild, from the Python side.
      # This step catches the same mistake from the git side - a contributor who
      # ran `npm run build` locally but forgot to commit the result - as a clean
      # diff rather than a cryptic Python assertion failure.
      - name: Build, and fail if the committed bundle would change
        working-directory: frontend
        run: |
          npm run build
          git diff --exit-code -- ../custom_components/shabbat_scheduler/www/ bundle-manifest.json
