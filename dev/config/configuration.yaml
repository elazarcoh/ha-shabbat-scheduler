# Onboarding defaults time_zone to UTC, and the engine converts every zman
# into Home Assistant's configured zone - so an unpinned dev instance shows
# candle lighting three hours early and derives blocks against the wrong
# local dates. Production runs Asia/Jerusalem; the Python suite pins it too
# (the `jerusalem` fixture in tests/conftest.py exists for the same reason).
# Pin it here so the throwaway instance matches what it is standing in for.
homeassistant:
  time_zone: Asia/Jerusalem

default_config:

input_boolean:
  salon:
    name: Salon AC stand-in
  kids:
    name: Kids AC stand-in
  # Actuated by the two generic_thermostats below, so their switching can
  # never disturb the two stand-ins the seeded rules drive.
  heater_salon:
    name: Thermostat output (salon)
  heater_kids:
    name: Thermostat output (kids)

# The device-aware settings form is this branch's headline feature, and
# with only input_boolean/switch entities in this fixture every e2e test
# ran with `options.climate === false` - so the intersection, the
# narrowest-bounds and the orphan-option logic were exercised ONLY under
# happy-dom, the same emulator the plan documents as mis-rendering exactly
# these nested templates. These two exist to give that logic a real
# browser to be wrong in.
#
# generic_thermostat rather than the `demo` platform: demo's climates all
# report the same fan modes and the same 7/35 bounds, so an intersection
# of them proves nothing, while generic_thermostat lets min_temp/max_temp
# and hvac_modes be set per entity. Chosen so that no two of the three
# possible selections agree:
#
#   salon alone       -> hvac ['heat','off'],  16.0 .. 32.0
#   kids alone        -> hvac ['cool','off'],  14.0 .. 31.0
#   both together     -> hvac ['off'],         16.0 .. 31.0
#
# `initial_hvac_mode: "off"` keeps them inert - they exist to be read, not
# to control anything.
# ONE `template:` key for the whole file. There were briefly two, and the
# second silently won: YAML resolves a duplicate mapping key by keeping the
# last, so `sensor.dev_room_temperature` vanished, both generic_thermostats
# lost the `target_sensor` they name below, and `current_temperature` went
# None on each. Nothing errored - the climates still registered and still
# accepted set_temperature, so the fixture looked fine and simply could not
# actuate. Add new template entities to THIS block; never open a second one.
template:
  - sensor:
      - name: Dev room temperature
        unique_id: dev_room_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state: "22"

      # A zmanim pair that ALWAYS brackets "now" and — unlike states poked
      # in via POST /api/states — SURVIVES A RESTART. Without this,
      # replay/catch-up cannot be tested at all: the fabricated sensors
      # vanish on restart, the engine finds no block, and catch-up correctly
      # does nothing, which looks exactly like a replay bug. Cost a real
      # debugging cycle before it was written down.
      #
      # The pair spans midnight deliberately. The engine rejects a same-day
      # pair as an "implausible zmanim pair" (a real Shabbat runs Friday
      # evening -> Saturday night), a guard worth keeping and easy to trip
      # with a naive fixture.
      - name: Livetest candle lighting
        unique_id: livetest_candle_lighting
        state: "{{ (now() - timedelta(days=1)).strftime('%Y-%m-%d') }}T18:44:00+03:00"
      - name: Livetest havdalah
        unique_id: livetest_havdalah
        state: "{{ now().strftime('%Y-%m-%d') }}T23:59:00+03:00"

  # A template switch, so the multi-domain execution work has a real
  # `switch.*` on the instance and not only in the suite. It proxies one of
  # the input_booleans rather than owning state, which keeps the fixture
  # inspectable: driving switch.dev_pump is visible on input_boolean.salon.
  - switch:
      - name: Dev pump
        unique_id: dev_pump
        state: "{{ is_state('input_boolean.salon', 'on') }}"
        turn_on:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.salon
        turn_off:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.salon

# Entities for the multi-domain execution work. The point of v2 is that the
# executor is not climate-shaped, and that cannot be demonstrated on an
# instance holding only booleans and two thermostats.
scene:
  - name: Dev evening
    entities:
      input_boolean.salon: "on"
      input_boolean.kids: "off"

script:
  dev_beep:
    alias: Dev beep
    sequence:
      - action: persistent_notification.create
        data:
          title: Dev beep
          message: The dev script ran.

climate:
  - platform: generic_thermostat
    name: Dev salon
    unique_id: dev_salon
    heater: input_boolean.heater_salon
    target_sensor: sensor.dev_room_temperature
    min_temp: 16
    max_temp: 32
    target_temp: 24
    target_temp_step: 0.5
    initial_hvac_mode: "off"
  - platform: generic_thermostat
    name: Dev kids
    unique_id: dev_kids
    ac_mode: true
    heater: input_boolean.heater_kids
    target_sensor: sensor.dev_room_temperature
    min_temp: 14
    max_temp: 31
    target_temp: 24
    target_temp_step: 0.5
    initial_hvac_mode: "off"

logger:
  default: info
  logs:
    custom_components.shabbat_scheduler: debug

# The livetest zmanim pair and the template switch live in the single
# `template:` block above, with the sensors. Do not reopen a second one here.
